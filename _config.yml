title: AIjuggernauts
description: >-
  AI tools, resources, and hands-on training for people learning to use AI effectively.
baseurl: ""
url: "https://aijuggernauts.com"

markdown: kramdown
permalink: /:categories/:title/

collections:
  simulations:
    output: true
    permalink: /simulations/:path/
  newsletter:
    output: true
    permalink: /newsletter/:path/

defaults:
  - scope:
      path: ""
      type: "simulations"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "newsletter"
    values:
      layout: "article"

nav:
  - title: Home
    url: /
  - title: Simulation Generator
    url: /tools/simulation-creator.html
  - title: Quick Case Generator
    url: /tools/quick-case-generator.html
  - title: Course Comparison
    url: /tools/course-comparison.html
  - title: Shop My Mind
    url: /tools/shop-my-mind.html
  - title: Upcoming Conferences
    url: /conferences/
  - title: Faculty Jobs
    url: /jobs/
  - title: AI News
    url: /ai-news/
  - title: AI Newsletter
    url: /newsletter/
  - title: Contact Us
    url: /contact/

exclude:
  - README.md
