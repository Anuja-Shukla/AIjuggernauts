title: AIjuggernauts
description: >-
  AI tools, resources, and hands-on training for people learning to use AI effectively.
baseurl: ""
url: "https://aijuggernauts.com"

markdown: kramdown
permalink: /:categories/:title/

collections:
  case_studies:
    output: true
    permalink: /case-studies/:path/
  simulations:
    output: true
    permalink: /simulations/:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "article"
  - scope:
      path: ""
      type: "case_studies"
    values:
      layout: "article"
  - scope:
      path: ""
      type: "simulations"
    values:
      layout: "page"

nav:
  - title: Home
    url: /
  - title: Articles
    url: /articles/
  - title: Case Studies
    url: /case-studies/
  - title: Simulations
    url: /simulations/
  - title: About
    url: /about/

exclude:
  - README.md
