---
layout: default
---
<article class="article">
  <h1>{{ page.title }}</h1>
  <p class="meta">
    {% if page.date %}{{ page.date | date: "%B %-d, %Y" }}{% endif %}
    {% if page.category %} &middot; {{ page.category }}{% endif %}
  </p>
  <div class="article-body">
    {{ content }}
  </div>
  {% if page.tags %}
  <p class="tags">
    {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
  </p>
  {% endif %}
</article>
