<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">
        <svg class="logo-mark" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="24" cy="24" r="23" fill="url(#haloGrad)"/>
          <path d="M12 30 Q12 12 24 12 Q36 12 36 30 Q36 37 24 37 Q12 37 12 30 Z" fill="#1b2140"/>
          <circle cx="17.5" cy="24" r="6" fill="#fdfcf7"/>
          <circle cx="30.5" cy="24" r="6" fill="#fdfcf7"/>
          <circle cx="17.5" cy="24" r="2.6" fill="#161a2e"/>
          <circle cx="30.5" cy="24" r="2.6" fill="#161a2e"/>
          <path d="M17 32 Q24 37 31 32" stroke="#fdfcf7" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <path d="M15 13 Q24 6 33 13" stroke="#f6c453" stroke-width="3" fill="none" stroke-linecap="round"/>
          <defs>
            <radialGradient id="haloGrad" cx="50%" cy="45%" r="60%">
              <stop offset="0%" stop-color="#ffe3a3"/>
              <stop offset="100%" stop-color="#f5a623"/>
            </radialGradient>
          </defs>
        </svg>
        <span>AIjuggernauts</span>
      </a>
      <nav class="tabs">
        {% for item in site.nav %}
          <a href="{{ item.url | relative_url }}"
             class="tab {% if page.url == item.url %}active{% endif %}">
            {{ item.title }}
          </a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main class="wrap content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; {{ 'now' | date: "%Y" }} AIjuggernauts. AI tools and training for practical learners.</p>
    </div>
  </footer>

  <div id="reg-gate-overlay" class="reg-gate-overlay">
    <div class="reg-gate-box">
      <svg class="logo-mark" style="width:44px;height:44px;margin-bottom:14px;" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="24" cy="24" r="23" fill="url(#haloGradGate)"/>
        <path d="M12 30 Q12 12 24 12 Q36 12 36 30 Q36 37 24 37 Q12 37 12 30 Z" fill="#1b2140"/>
        <circle cx="17.5" cy="24" r="6" fill="#fdfcf7"/>
        <circle cx="30.5" cy="24" r="6" fill="#fdfcf7"/>
        <circle cx="17.5" cy="24" r="2.6" fill="#161a2e"/>
        <circle cx="30.5" cy="24" r="2.6" fill="#161a2e"/>
        <path d="M17 32 Q24 37 31 32" stroke="#fdfcf7" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M15 13 Q24 6 33 13" stroke="#f6c453" stroke-width="3" fill="none" stroke-linecap="round"/>
        <defs>
          <radialGradient id="haloGradGate" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#ffe3a3"/>
            <stop offset="100%" stop-color="#f5a623"/>
          </radialGradient>
        </defs>
      </svg>
      <h2>Welcome to AIjuggernauts</h2>
      <p>Quick registration before you dive in — takes 10 seconds.</p>
      <form id="reg-gate-form">
        <label for="reg-name">Name</label>
        <input type="text" id="reg-name" required>
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" required>
        <button type="submit">Get Started</button>
        <p id="reg-gate-status" class="reg-gate-status"></p>
      </form>
    </div>
  </div>

  <script>
  (function() {
    var STORAGE_KEY = "aijuggernauts_registered";
    var overlay = document.getElementById('reg-gate-overlay');
    if (localStorage.getItem(STORAGE_KEY)) {
      overlay.style.display = 'none';
      return;
    }
    overlay.style.display = 'flex';
    document.body.style.overflow = 'hidden';

    document.getElementById('reg-gate-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var name = document.getElementById('reg-name').value.trim();
      var email = document.getElementById('reg-email').value.trim();
      var status = document.getElementById('reg-gate-status');
      var button = e.target.querySelector('button');

      button.disabled = true;
      status.textContent = 'Registering...';

      fetch('https://formsubmit.co/ajax/anujaa.gshukla@gmail.com', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: name,
          email: email,
          _subject: 'New AIjuggernauts registration'
        })
      })
        .then(function() {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ name: name, email: email, date: new Date().toISOString() }));
          overlay.style.display = 'none';
          document.body.style.overflow = '';
        })
        .catch(function() {
          status.textContent = 'Something went wrong — please try again.';
          button.disabled = false;
        });
    });
  })();
  </script>
</body>
</html>
