<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">
        <svg class="logo-mark" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="24" cy="24" r="23" fill="url(#haloGrad)"/>
          <path d="M12 30 Q12 12 24 12 Q36 12 36 30 Q36 37 24 37 Q12 37 12 30 Z" fill="#1b2140"/>
          <circle cx="17.5" cy="24" r="6" fill="#fdfcf7"/>
          <circle cx="30.5" cy="24" r="6" fill="#fdfcf7"/>
          <circle cx="17.5" cy="24" r="2.6" fill="#161a2e"/>
          <circle cx="30.5" cy="24" r="2.6" fill="#161a2e"/>
          <path d="M17 32 Q24 37 31 32" stroke="#fdfcf7" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <path d="M15 13 Q24 6 33 13" stroke="#f6c453" stroke-width="3" fill="none" stroke-linecap="round"/>
          <defs>
            <radialGradient id="haloGrad" cx="50%" cy="45%" r="60%">
              <stop offset="0%" stop-color="#ffe3a3"/>
              <stop offset="100%" stop-color="#f5a623"/>
            </radialGradient>
          </defs>
        </svg>
        <span>AIjuggernauts</span>
      </a>
      <nav class="tabs">
        {% for item in site.nav %}
          <a href="{{ item.url | relative_url }}"
             class="tab {% if page.url == item.url %}active{% endif %}">
            {{ item.title }}
          </a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main class="wrap content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; {{ 'now' | date: "%Y" }} AIjuggernauts. AI products and consulting. A platform of Intellique Research School Pvt Ltd.</p>
      <p class="foot-links"><a href="https://www.aistudytools.com/">AIStudyTools</a><a href="https://www.theresearchschool.com/">The Research School</a><a href="https://intelliqueresearchschool.com/">Intellique Research School</a></p>
    </div>
  </footer>
</body>
</html>
